openapi: 3.0.3
info:
  title: Modelia AI Studio API
  version: 1.0.0
  description: REST API providing authentication and simulated fashion generation.
servers:
  - url: http://localhost:4000
paths:
  /auth/signup:
    post:
      summary: Create a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      summary: Authenticate an existing user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /generations:
    get:
      summary: Fetch recent generations for the authenticated user
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 10
          description: Number of generations to retrieve (default 5)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Recent generations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Generation'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Trigger a simulated generation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - prompt
                - style
                - image
              properties:
                prompt:
                  type: string
                  minLength: 5
                  maxLength: 250
                style:
                  type: string
                image:
                  type: string
                  format: binary
      responses:
        '201':
          description: Generation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Generation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Simulated overload error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT token
        user:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
              format: email
    Generation:
      type: object
      properties:
        id:
          type: string
        prompt:
          type: string
        style:
          type: string
        imageUrl:
          type: string
          format: uri
        status:
          type: string
          enum: [COMPLETED, FAILED]
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        message:
          type: string
  responses:
    BadRequest:
      description: Invalid payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

